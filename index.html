<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>평단 계산기</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f4fd1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: ledger-style tool — holdings rail on the left, selected ticker's ledger + simulator on the right; stacks on phone */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#18202e; --muted:#5d6779; --line:#dde1e9;
  --accent:#2f4fd1; --accent-soft:#e7ecfd;
  --up:#d6303b; --down:#1f62d6;   /* 국내 관례: 상승 빨강, 하락 파랑 */
  --sans:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141c; --panel:#181e29; --ink:#e6e9f0; --muted:#97a0b2; --line:#2a3242;
  --accent:#7d95ff; --accent-soft:#232c48; --up:#ff6b72; --down:#5d9bff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --panel:#181e29; --ink:#e6e9f0; --muted:#97a0b2; --line:#2a3242;
  --accent:#7d95ff; --accent-soft:#232c48; --up:#ff6b72; --down:#5d9bff; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.fx{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.num,input.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
/* holdings rail */
.rail-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.hold{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;cursor:pointer}
.hold:hover{background:var(--accent-soft)}
.hold[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.hold .tk{font-family:var(--mono);font-weight:600;font-size:15px}
.hold .sub{color:var(--muted);font-size:12px}
.addtk{display:flex;gap:6px;padding:12px 14px}
.addtk input{flex:1;min-width:0;text-transform:uppercase}
/* controls */
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 12px;font-weight:500;white-space:nowrap}
:root[data-theme="dark"] .btn{color:#0d1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0d1220}}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.x{background:none;border:0;color:var(--muted);padding:2px 6px;border-radius:4px}
.x:hover{color:var(--up);background:var(--accent-soft)}
/* main */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{padding:16px}
.sec h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end}
.big .v{font-size:30px;font-weight:600;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 20px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stats .v{font-size:16px;font-weight:500}
.stats .k{font-size:12px;color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.buy{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.pill.sell{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:500;font-size:12px;color:var(--muted)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
form.tx{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px;align-items:end}
form.tx label,.sim label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.sims{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.sim{display:flex;flex-direction:column;gap:8px}
.sim .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.result{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;min-height:62px}
.result b{font-family:var(--mono);font-size:16px}
.note{font-size:12px;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.backup{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px}
.sample{font-size:12px;color:var(--muted);background:var(--accent-soft);padding:6px 10px;border-radius:6px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>미국주식 평단 계산기</h1>
    <div class="fx"><label for="fx">환율 ₩/$</label><input id="fx" class="num" type="number" step="0.1" style="width:96px"></div>
  </header>
  <p id="sampleNote" class="sample" hidden>예시 데이터가 들어 있습니다. 종목 옆 ✕로 지우고 실제 보유 종목을 추가하세요.</p>
  <div class="grid">
    <aside class="panel">
      <div class="rail-h"><span class="label">보유 종목</span><span id="totalPl" class="num" style="font-size:13px"></span></div>
      <div id="rail"></div>
      <form class="addtk" id="addTk"><input id="newTk" placeholder="티커 (예: AAPL)" maxlength="10" autocomplete="off"><button class="btn">추가</button></form>
    </aside>
    <section class="main" id="main"></section>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
const KEY='avgcost.v1';
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const SAMPLE={fx:1385,sel:'NVDA',sample:true,stocks:{
  NVDA:{price:182.5,tx:[{d:'2026-03-04',t:'buy',q:10,p:118.2,f:0.5},{d:'2026-05-12',t:'buy',q:5,p:135.8,f:0.3},{d:'2026-07-21',t:'sell',q:3,p:171.4,f:0.3},{d:'2026-08-29',t:'buy',q:4,p:166.0,f:0.3}]},
  AAPL:{price:228.1,tx:[{d:'2026-02-10',t:'buy',q:8,p:241.5,f:0.4},{d:'2026-04-22',t:'buy',q:6,p:205.3,f:0.3}]},
  SCHD:{price:27.9,tx:[{d:'2026-01-15',t:'buy',q:100,p:27.1,f:1},{d:'2026-06-03',t:'buy',q:60,p:26.4,f:0.6}]}
}};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.stocks)S=JSON.parse(JSON.stringify(SAMPLE));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=s=>document.querySelector(s);
const usd=(n,d=2)=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const krw=n=>(n<0?'-':'')+'₩'+Math.round(Math.abs(n)).toLocaleString('ko-KR');
const qf=n=>(+n.toFixed(6)).toLocaleString('en-US',{maximumFractionDigits:6});
const pct=n=>(n>0?'+':'')+n.toFixed(2)+'%';
const cls=n=>n>0?'up':n<0?'down':'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 이동평균법: 매수 시 (기존원가+매수금액+수수료)/(보유수량), 매도 시 평단 유지·실현손익 계산 */
function calc(st){
  let sh=0,cost=0,realized=0,bought=0;
  const rows=[...st.tx].map((x,i)=>({...x,i})).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.i-b.i).map(x=>{
    const f=+x.f||0;
    if(x.t==='buy'){sh+=x.q;cost+=x.q*x.p+f;bought+=x.q*x.p+f;x.rp=null}
    else{const avg=sh?cost/sh:0;const q=Math.min(x.q,sh);x.rp=q*x.p-f-avg*q;realized+=x.rp;cost-=avg*q;sh-=q;if(sh<1e-9){sh=0;cost=0}}
    x.sh=sh;x.avg=sh?cost/sh:0;return x;});
  const avg=sh?cost/sh:0,val=sh*(+st.price||0),pl=val-cost;
  return{sh,cost,avg,val,pl,plp:cost?pl/cost*100:0,realized,rows};
}

function render(){
  $('#fx').value=S.fx||'';
  $('#sampleNote').hidden=!S.sample;
  const tks=Object.keys(S.stocks);
  if(!S.stocks[S.sel])S.sel=tks[0];
  let tc=0,tv=0;
  $('#rail').innerHTML=tks.map(tk=>{
    const c=calc(S.stocks[tk]);tc+=c.cost;tv+=c.val;
    return `<button class="hold" data-tk="${esc(tk)}" aria-current="${tk===S.sel}">
      <span class="tk">${esc(tk)}</span><span class="num ${cls(c.pl)}">${c.cost?pct(c.plp):'—'}</span>
      <span class="sub num">${qf(c.sh)}주 · 평단 ${usd(c.avg)}</span><span class="sub num">${usd(c.val,0)}</span></button>`}).join('')||'<div class="empty">종목을 추가하세요</div>';
  const tpl=tv-tc;
  $('#totalPl').innerHTML=tc?`<span class="${cls(tpl)}">${usd(tpl,0)} (${pct(tpl/tc*100)})</span>`:'';
  renderMain();
}

function renderMain(){
  const tk=S.sel,st=S.stocks[tk],m=$('#main');
  if(!st){m.innerHTML='<div class="panel empty">왼쪽에서 티커를 추가하면 매수 기록과 평단가가 여기에 표시됩니다.</div>';return}
  const c=calc(st),fx=+S.fx||0;
  m.innerHTML=`
  <div class="panel sec">
    <h2><span class="num" style="font-size:20px">${esc(tk)}</span><button class="ghost" id="delTk">종목 삭제</button></h2>
    <div class="big">
      <div><div class="label">평단가</div><div class="v num">${usd(c.avg,4)}</div></div>
      <div><label class="label" for="price">현재가 ($)</label><div><input id="price" class="num" type="number" step="0.01" value="${st.price||''}" style="width:130px;font-size:18px"></div></div>
      <div><div class="label">평가손익</div><div class="v num ${cls(c.pl)}" style="font-size:24px">${usd(c.pl)} <span style="font-size:15px">${pct(c.plp)}</span></div></div>
    </div>
    <div class="stats">
      <div><div class="k">보유 수량</div><div class="v num">${qf(c.sh)}주</div></div>
      <div><div class="k">매입 금액</div><div class="v num">${usd(c.cost)}</div></div>
      <div><div class="k">평가 금액</div><div class="v num">${usd(c.val)}</div></div>
      <div><div class="k">실현 손익</div><div class="v num ${cls(c.realized)}">${usd(c.realized)}</div></div>
      ${fx?`<div><div class="k">평가 금액 (원화)</div><div class="v num">${krw(c.val*fx)}</div></div>
      <div><div class="k">평가손익 (원화)</div><div class="v num ${cls(c.pl)}">${krw(c.pl*fx)}</div></div>`:''}
    </div>
  </div>

  <div class="panel sec">
    <h2>거래 기록</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>날짜</th><th>구분</th><th>수량</th><th>단가</th><th>수수료</th><th>보유</th><th>평단 (거래 후)</th><th>실현손익</th><th></th></tr></thead>
      <tbody>${c.rows.length?c.rows.map(r=>`<tr>
        <td class="num">${r.d}</td><td><span class="pill ${r.t}">${r.t==='buy'?'매수':'매도'}</span></td>
        <td class="num">${qf(r.q)}</td><td class="num">${usd(r.p)}</td><td class="num">${r.f?usd(+r.f):'—'}</td>
        <td class="num">${qf(r.sh)}</td><td class="num">${usd(r.avg,4)}</td>
        <td class="num ${r.rp==null?'':cls(r.rp)}">${r.rp==null?'—':usd(r.rp)}</td>
        <td><button class="x" data-del="${r.i}" aria-label="거래 삭제">✕</button></td></tr>`).join(''):'<tr><td colspan="9" class="empty">아래에서 첫 매수를 입력하세요</td></tr>'}</tbody>
    </table></div>
    <form class="tx" id="txForm">
      <label>날짜<input id="txD" type="date" value="${today()}" required></label>
      <label>구분<select id="txT"><option value="buy">매수</option><option value="sell">매도</option></select></label>
      <label>수량<input id="txQ" class="num" type="number" step="any" min="0" required placeholder="10"></label>
      <label>단가 ($)<input id="txP" class="num" type="number" step="any" min="0" required placeholder="150.00"></label>
      <label>수수료 ($)<input id="txF" class="num" type="number" step="any" min="0" placeholder="0"></label>
      <button class="btn">기록 추가</button>
    </form>
    <p class="note">이동평균법으로 계산합니다. 매수 수수료는 평단에 포함되고, 매도해도 남은 주식의 평단은 그대로입니다.</p>
  </div>

  <div class="panel sec">
    <h2>물타기 · 불타기 시뮬레이션</h2>
    <div class="sims">
      <div class="sim">
        <div class="label">추가 매수하면 평단은?</div>
        <div class="row"><label>수량<input id="sQ" class="num" type="number" step="any" min="0" placeholder="5"></label>
        <label>가격 ($)<input id="sP" class="num" type="number" step="any" min="0" value="${st.price||''}"></label></div>
        <div class="result" id="sR1"></div>
      </div>
      <div class="sim">
        <div class="label">목표 평단까지 몇 주?</div>
        <div class="row"><label>목표 평단 ($)<input id="tA" class="num" type="number" step="any" min="0" placeholder="${c.avg?(c.avg*0.95).toFixed(2):''}"></label>
        <label>매수 가격 ($)<input id="tP" class="num" type="number" step="any" min="0" value="${st.price||''}"></label></div>
        <div class="result" id="sR2"></div>
      </div>
    </div>
  </div>

  <div class="panel sec">
    <h2>백업</h2>
    <p class="note" style="margin:0 0 8px">기록은 이 브라우저에만 저장됩니다. 다른 기기로 옮기거나 보관하려면 복사해 두세요.</p>
    <div class="backup"><button class="ghost" id="cpy">데이터 복사</button><button class="ghost" id="restoreBtn">붙여넣어 복원</button><button class="ghost" id="resetBtn">초기화</button></div>
    <div id="restoreBox" hidden><textarea id="restoreTxt" placeholder="복사해 둔 데이터를 붙여넣으세요"></textarea><button class="btn" id="restoreGo" style="margin-top:6px">복원</button></div>
    <div id="resetBox" hidden style="margin-top:8px" class="note">모든 종목과 기록을 지웁니다. <button class="ghost" id="resetGo" style="color:var(--up)">전부 지우기</button></div>
  </div>`;
  sim(c);
}

function sim(c){
  const st=S.stocks[S.sel];if(!st)return;
  const q=+$('#sQ').value,p=+$('#sP').value,r1=$('#sR1');
  if(q>0&&p>0){const na=(c.cost+q*p)/(c.sh+q),d=c.avg?(na/c.avg-1)*100:0,cur=+st.price||p;
    r1.innerHTML=`새 평단 <b>${usd(na,4)}</b> <span class="num ${cls(d)}">(${pct(d)})</span><br>
    <span class="note num">필요 금액 ${usd(q*p)}${S.fx?' · '+krw(q*p*S.fx):''} · 보유 ${qf(c.sh+q)}주 · 현재가 기준 수익률 ${pct((cur/na-1)*100)}</span>`;}
  else r1.innerHTML='<span class="note">수량과 가격을 넣으면 바뀐 평단이 바로 나옵니다.</span>';
  const T=+$('#tA').value,P=+$('#tP').value,r2=$('#sR2');
  if(T>0&&P>0&&c.sh>0){
    const x=(c.cost-T*c.sh)/(T-P);
    if(!isFinite(x)||x<=0)r2.innerHTML=`<span class="note">불가능한 조합입니다. 목표 평단은 현재 평단(${usd(c.avg)})과 매수 가격 사이에 있어야 합니다.</span>`;
    else{const n=Math.ceil(x),na=(c.cost+n*P)/(c.sh+n);
      r2.innerHTML=`<b>${n.toLocaleString()}주</b> 매수 필요 <span class="note num">(소수점 ${qf(x)}주)</span><br>
      <span class="note num">필요 금액 ${usd(n*P)}${S.fx?' · '+krw(n*P*S.fx):''} · ${n}주 매수 시 평단 ${usd(na,4)}</span>`;}
  } else r2.innerHTML='<span class="note">목표 평단과 매수 가격을 넣으세요.</span>';
}

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,1800)}
function commit(){S.sample=S.sample&&true;save();render()}

document.addEventListener('click',e=>{
  const h=e.target.closest('.hold');if(h){S.sel=h.dataset.tk;save();render();return}
  const d=e.target.closest('[data-del]');if(d){S.stocks[S.sel].tx.splice(+d.dataset.del,1);commit();return}
  const id=e.target.id;
  if(id==='delTk'){if(e.target.dataset.armed){delete S.stocks[S.sel];S.sel=Object.keys(S.stocks)[0];commit();toast('종목을 삭제했습니다')}else{e.target.dataset.armed=1;e.target.textContent='한 번 더 누르면 삭제';e.target.style.color='var(--up)'}}
  if(id==='cpy'){const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('데이터를 복사했습니다')).catch(()=>{$('#restoreBox').hidden=false;$('#restoreTxt').value=t;$('#restoreTxt').select();toast('선택된 텍스트를 직접 복사하세요')})}
  if(id==='restoreBtn')$('#restoreBox').hidden=!$('#restoreBox').hidden;
  if(id==='restoreGo'){try{const n=JSON.parse($('#restoreTxt').value);if(!n.stocks)throw 0;S=n;S.sample=false;commit();toast('복원했습니다')}catch(_){toast('형식이 맞지 않습니다. 복사한 텍스트 전체를 붙여넣으세요')}}
  if(id==='resetBtn')$('#resetBox').hidden=!$('#resetBox').hidden;
  if(id==='resetGo'){S={fx:S.fx,sel:null,stocks:{}};commit();toast('초기화했습니다')}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='addTk'){const t=$('#newTk').value.trim().toUpperCase().replace(/[^A-Z0-9.\-]/g,'');if(!t)return;
    if(!S.stocks[t])S.stocks[t]={price:0,tx:[]};S.sel=t;S.sample=false;commit();toast(t+' 추가됨')}
  if(e.target.id==='txForm'){const st=S.stocks[S.sel],t=$('#txT').value,q=+$('#txQ').value,p=+$('#txP').value;
    if(!(q>0&&p>0))return;
    if(t==='sell'&&q>calc(st).sh+1e-9){toast('보유 수량보다 많이 매도할 수 없습니다');return}
    st.tx.push({d:$('#txD').value||today(),t,q,p,f:+$('#txF').value||0});commit();toast('기록했습니다')}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='fx'){S.fx=+e.target.value||0;save();clearTimeout(render.h);render.h=setTimeout(()=>{const a=document.activeElement?.id;render();if(a)$('#'+a)?.focus()},500)}
  if(id==='price'){S.stocks[S.sel].price=+e.target.value||0;save();clearTimeout(render.h);render.h=setTimeout(()=>{if(document.activeElement?.id!=='price')render();else{render();$('#price').focus()}},600)}
  if(['sQ','sP','tA','tP'].includes(id))sim(calc(S.stocks[S.sel]));
});
render();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))}
</script>
</body>
</html>
