<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>쭈식관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
/* 카톡 인앱 브라우저로 열리면 기본 브라우저(Chrome)로 다시 열기 */
if(/KAKAOTALK/i.test(navigator.userAgent)){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)}
</script>
<meta name="theme-color" content="#2f4fd1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: mobile-first single column, sticky header, fixed bottom tab bar (보유 · 종목 · 시뮬 · 설정) */
:root{
  --bg:#f2f3f6; --panel:#ffffff; --ink:#171c26; --muted:#6a7383; --line:#e6e8ed;
  --accent:#2f4fd1; --accent-soft:#e7ecfd; --on-accent:#ffffff;
  --up:#d6303b; --down:#1f62d6;   /* 국내 관례: 상승 빨강, 하락 파랑 */
  --sans:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:var(--sans);   /* 숫자도 같은 글꼴, tabular-nums로 자릿수 정렬 */
  --cash:#9aa3b2;
  --c1:#2f4fd1; --c2:#e08a1e; --c3:#159a8c; --c4:#c2477f; --c5:#6b9a1f; --c6:#7a5cc7; --c7:#d0603a; --c8:#2c93c9; --c9:#b8962e; --c10:#4d6b8a; --c11:#a35bb0; --c12:#3fa86b; --cx:#9aa1ad;
}
@media (prefers-color-scheme:dark){:root{
  --cash:#5a6374;
  --c1:#7d95ff; --c2:#f2a54a; --c3:#3cc7b6; --c4:#ea7fb2; --c5:#a3c95a; --c6:#a68cf0; --c7:#ef8a68; --c8:#6fc0ee; --c9:#e0c062; --c10:#93abc4; --c11:#cf93da; --c12:#6fd39a; --cx:#6c7588}}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1218; --panel:#181c25; --ink:#e9ecf2; --muted:#959eae; --line:#262c38;
  --accent:#7d95ff; --accent-soft:#232c48; --on-accent:#0d1220; --up:#ff6b72; --down:#5d9bff; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;letter-spacing:-.01em}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.muted{color:var(--muted)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
header h1{margin:0;font-size:20px;letter-spacing:-.01em}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:4px calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 10px;font-size:15px}
.label{font-size:12px;color:var(--muted)}
.big{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv .v{font-size:16px;font-weight:500}
.split{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* holdings */
.hold{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:inherit;font:inherit;cursor:pointer}
.hold:active{background:var(--accent-soft)}
.hold .tk{font-family:var(--mono);font-weight:700;font-size:17px}
.hold .pl{font-family:var(--mono);font-weight:600;font-size:17px;text-align:right}
.hold .sub{font-size:13px;color:var(--muted)}
.hold .sub.r{text-align:right}

/* ticker chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:7px 14px;font-family:var(--mono);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* forms */
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:12px 16px;cursor:pointer;width:100%}
.ghost{font:inherit;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
.ghost.danger{color:var(--up)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-weight:600;border:0;background:none;color:var(--muted);padding:8px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"].b{background:var(--up);color:#fff}
.seg button[aria-pressed="true"].s{background:var(--down);color:#fff}
.stack{display:flex;flex-direction:column;gap:10px}

/* transactions */
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.buy{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.pill.sell{background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down)}
.tx .main{font-family:var(--mono);font-size:15px}
.tx .meta{grid-column:2/4;font-size:12px;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer}
.x.armed{color:var(--up);background:var(--accent-soft)}

.result{background:var(--bg);border-radius:10px;padding:12px;font-size:14px;min-height:64px}
.result b{font-family:var(--mono);font-size:19px}
.note{font-size:13px;color:var(--muted);margin:0}
.sample{font-size:13px;color:var(--muted);background:var(--accent-soft);padding:10px 12px;border-radius:10px;margin:0}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
textarea{width:100%;min-height:100px;font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}

/* allocation chart */
.alloc{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:360px){.alloc{grid-template-columns:minmax(0,1fr)}.alloc svg{margin:0 auto}}
.alloc svg{width:150px;height:150px;display:block}
.alloc .ctr1{font-size:11px;fill:var(--muted);font-family:var(--sans)}
.alloc .ctr2{font-size:17px;font-weight:700;fill:var(--ink);font-family:var(--mono)}
.legend{display:flex;flex-direction:column;gap:8px;min-width:0}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:2px 8px;align-items:center;font-size:14px}
.lg .dot{width:10px;height:10px;border-radius:3px}
.lg .t{font-family:var(--mono);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.lg .p{font-family:var(--mono);font-weight:600;text-align:right}
.lg .bar{grid-column:2/4;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.lg .bar i{display:block;height:100%;border-radius:2px}
.lg .s{grid-column:2/4;font-size:12px;color:var(--muted);font-family:var(--mono)}
.seg.sm button{padding:5px 10px;font-size:13px}
.seg.sm button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.warn{font-size:13px;margin:12px 0 0;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--c2) 14%,transparent);color:var(--ink)}

/* IPO */
.ychips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.ychips::-webkit-scrollbar{display:none}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:84px;margin-top:6px}
.months .m{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.months .m i{display:block;width:100%;max-width:18px;border-radius:3px 3px 0 0;background:var(--up)}
.months .m i.neg{background:var(--down);border-radius:0 0 3px 3px}
.months .m span{font-size:10px;color:var(--muted)}
.ipo{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line)}
.ipo:first-child{border-top:0}
.ipo .n{font-weight:600}
.ipr{display:block;font-size:12px;font-weight:600;color:var(--muted);text-align:right}
.ipr.up{color:var(--up)}.ipr.down{color:var(--down)}
.ipo .v{font-family:var(--mono);font-weight:600;text-align:right}
.ipo .meta{font-size:12px;color:var(--muted)}
.ipo .act{text-align:right}
nav button{font-size:10.5px}

/* sync */
.sdot{width:12px;height:12px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--muted)}
.sdot.ok{background:#22a06b}.sdot.pending{background:#e0a21e}.sdot.error,.sdot.conflict{background:var(--up)}
.conflict{border-color:var(--up)}
.conflict .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sstat{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bg)}
details.guide summary{cursor:pointer;font-size:14px;color:var(--accent)}
details.guide ol{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* holdings v2 */
.hero .big{font-size:32px}
.plrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.chg{display:inline-flex;align-items:center;gap:2px;padding:2px 8px;border-radius:99px;font-family:var(--mono);font-weight:700;font-size:13px;background:var(--bg);color:var(--muted)}
.chg.up{background:color-mix(in srgb,var(--up) 13%,transparent);color:var(--up)}
.chg.down{background:color-mix(in srgb,var(--down) 13%,transparent);color:var(--down)}
.flow{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:8px;align-items:end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.flow .arrow{color:var(--muted);padding-bottom:2px}
.flow .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px;justify-self:end}
.flow>div:last-child{text-align:right}
.flow .fv{font-size:16px;font-weight:600}
.secth{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 0}
.secth h2{margin:0;font-size:16px}
.linkbtn{font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 4px}
.hlist{display:flex;flex-direction:column;gap:8px}
.hcard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:inherit;font:inherit;cursor:pointer}
.hcard.cash{cursor:default}
button.hcard:active{background:var(--accent-soft)}
.hcard .h1,.hcard .h2,.hcard .h3{display:flex;align-items:center;gap:8px;min-width:0}
.hcard .h2{justify-content:space-between;font-size:13px}
.hcard .dot{width:10px;height:10px;border-radius:3px;flex:none}
.hcard .tk{font-family:var(--mono);font-weight:700;font-size:17px}
.hcard .hv{margin-left:auto;font-size:17px;font-weight:700}
.hcard .plv{font-weight:600}
.hcard .wbar{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.hcard .wbar i{display:block;height:100%;border-radius:3px}
.hcard .h3 .muted{font-size:12px;min-width:44px;text-align:right}
.need{font-size:12px;font-weight:600;color:var(--c2);background:color-mix(in srgb,var(--c2) 14%,transparent);padding:2px 8px;border-radius:99px;font-family:var(--sans)}

.qline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:12px}
.qwarn{color:var(--c2)}
.ldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.ldot.on{background:#22a06b;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.ldot.on{animation:none}}
.hcard .today .chg{font-size:11px;padding:1px 6px}
.dayrow{margin-top:4px}
.news{display:flex;flex-direction:column}
.nitem{display:flex;flex-direction:column;gap:3px;padding:11px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.nitem:first-child{border-top:0;padding-top:4px}
.nitem:active .nh{color:var(--accent)}
.nmeta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.ntk{font-family:var(--mono);font-weight:700;font-size:11px;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);padding:1px 6px;border-radius:4px}
.linkbtn.nl{font-size:12px;font-weight:600;color:var(--muted);margin-right:4px}
.nh{font-size:14.5px;font-weight:600;line-height:1.4}
.ns{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* holdings v3 */
.hero2{padding:6px 4px 4px}
.hbig{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:4px 0 6px}
.hline{display:flex;gap:8px;align-items:baseline;font-size:15px;font-weight:600}
.hline .muted{font-size:13px;font-weight:500}
.hmeta{font-size:13px;color:var(--muted);margin-top:6px}
.seg.mini{display:inline-grid;grid-auto-flow:column;grid-template-columns:none;padding:2px;border-radius:9px}
.seg.mini button{padding:5px 12px;font-size:13px;border-radius:7px;color:var(--muted)}
.seg.mini button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08),0 0 0 1px var(--line)}
.lhead{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.card.list{padding:4px 0}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:11px 14px;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer}
.lrow:first-child{border-top:0}
.lrow:active{background:var(--accent-soft)}
.ll,.lr{display:flex;flex-direction:column;gap:1px;min-width:0}
.lr{align-items:flex-end;text-align:right}
.lt{font-weight:700;font-size:15px;display:flex;align-items:baseline;gap:5px;min-width:0;white-space:nowrap}
.lname{overflow:hidden;text-overflow:ellipsis;min-width:0}
.lnm{font-weight:700;color:var(--muted)}
.ll{flex:1}
.nowrap{white-space:nowrap}
.lp{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none;font-variant-numeric:tabular-nums;border-radius:6px;padding:0 4px;margin:0 -4px}
.lpx{font-size:13.5px;font-weight:600}
.lch{font-size:11.5px;font-weight:600;min-height:1em}
.flash-up{animation:flu 1.2s ease-out}.flash-down{animation:fld 1.2s ease-out}
@keyframes flu{0%{background:color-mix(in srgb,var(--up) 22%,transparent)}100%{background:transparent}}
@keyframes fld{0%{background:color-mix(in srgb,var(--down) 22%,transparent)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash-up,.flash-down{animation:none}}
.ls{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.lv{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}
.lm{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;white-space:nowrap}
.wmini{display:inline-block;width:44px;height:5px;border-radius:3px;background:var(--bg);overflow:hidden}
.wmini i{display:block;height:100%}
.cashedit{padding:4px 16px 14px}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--bg)}
.sbar i{display:block;height:100%;min-width:2px}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend2 span{display:inline-flex;align-items:center;gap:5px}
.legend2 i{width:9px;height:9px;border-radius:3px;display:inline-block}
.legend2 b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.schip{font:inherit;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer;display:inline-flex;align-items:center;font-variant-numeric:tabular-nums}
.card{border-radius:16px}

.ro #addToggle,.ro #addTk,.ro .x,.ro #toggleForm,.ro #txForm,.ro #delTk,.ro #ipoForm,.ro #cashToggle .lm,.ro .cashedit,.ro #priceLab,.ro #nameLab,.ro #resetGo,.ro #restoreBtn,.ro #restoreBox{display:none!important}

/* bottom tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{font:inherit;font-size:11px;background:none;border:0;color:var(--muted);padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;white-space:nowrap}
</style>
</head>
<body>
<header><h1 id="ttl">보유 종목</h1><span style="display:flex;align-items:center;gap:10px"><span id="hdr" class="num" style="font-size:14px"></span><button id="syncDot" class="sdot" hidden aria-label="동기화 상태"></button></span></header>
<main id="main"></main>
<nav>
  <button data-tab="hold"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>보유</button>
  <button data-tab="stock"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>종목</button>
  <button data-tab="sim"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M5 12H3M21 12h-2"/><circle cx="12" cy="12" r="5"/></svg>물타기</button>
  <button data-tab="ipo"><svg viewBox="0 0 24 24"><path d="M4 8h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/><path d="M14 8v12" stroke-dasharray="2 2"/></svg>공모주</button>

</nav>
<div id="toast" class="toast" hidden></div>

<script>
const KEY='avgcost.v1', TABKEY='avgcost.tab';
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const SAMPLE={fx:1385,sel:'NVDA',sample:true,stocks:{
  NVDA:{price:182.5,tx:[{d:'2026-03-04',t:'buy',q:10,p:118.2,f:0.5},{d:'2026-05-12',t:'buy',q:5,p:135.8,f:0.3},{d:'2026-07-21',t:'sell',q:3,p:171.4,f:0.3},{d:'2026-08-29',t:'buy',q:4,p:166.0,f:0.3}]},
  AAPL:{price:228.1,tx:[{d:'2026-02-10',t:'buy',q:8,p:241.5,f:0.4},{d:'2026-04-22',t:'buy',q:6,p:205.3,f:0.3}]},
  SCHD:{price:27.9,tx:[{d:'2026-01-15',t:'buy',q:100,p:27.1,f:1},{d:'2026-06-03',t:'buy',q:60,p:26.4,f:0.6}]}
}};
let S,tab='hold',txType='buy',formOpen=false,basis='val';
try{basis=localStorage.getItem('avgcost.basis')||'val'}catch(e){}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.stocks)S=JSON.parse(JSON.stringify(SAMPLE));
try{tab=localStorage.getItem(TABKEY)||'hold'}catch(e){}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{store();if(syncOn()){
  if(SY.ro){SY.roDirty=true;saveSY();clearTimeout(save.t);save.t=setTimeout(()=>toast('보기 전용이라 바꾼 내용은 저장되지 않습니다'),400);return}
  SY.dirty=true;SY.rev=(SY.rev||0)+1;saveSY();schedulePush()}};

/* ===== 구글 시트 동기화 =====
   SY: url, key, updated(마지막으로 맞춘 시트 버전), dirty(아직 안 올린 변경), last(마지막 성공 시각) */
let SY={url:'',key:'',updated:0,dirty:false,last:0,rev:0};
try{Object.assign(SY,JSON.parse(localStorage.getItem('avgcost.sync'))||{})}catch(e){}
const saveSY=()=>{try{localStorage.setItem('avgcost.sync',JSON.stringify(SY))}catch(e){}};
const syncOn=()=>!!(SY.url&&SY.key);
let syncState=syncOn()?'pending':'off',syncMsg='',conflict=null,pushTimer=null,busy=false;
function setSync(st,msg=''){syncState=st;syncMsg=msg;paintSync()}
function paintSync(){
  const d=document.getElementById('syncDot');if(!d)return;
  d.hidden=!syncOn();d.className='sdot '+syncState;
  d.title={ok:'동기화됨',pending:'동기화 중',error:'동기화 오류',conflict:'선택이 필요합니다'}[syncState]||'';
  const st=document.getElementById('syncStat');if(st)st.innerHTML=syncText();
}
function syncText(){
  if(!syncOn())return '연결되지 않았습니다.';
  const t=SY.last?new Date(SY.last).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'없음';
  return ({ok:'● 동기화됨',pending:'● 동기화 중…',error:'● '+(syncMsg||'오류'),conflict:'● 어느 쪽 데이터를 쓸지 선택하세요'}[syncState]||'')+`<br><span class="muted">마지막 동기화: ${t}${SY.dirty?' · 올리지 않은 변경 있음':''}</span>`;
}
function hasData(o){return o&&o.stocks&&(Object.keys(o.stocks).length||(o.ipo||[]).length)}
function buildView(){
  const h=[['티커','종목명','수량','평단($)','현재가($)','매입금액($)','평가금액($)','손익($)','수익률(%)','실현손익($)']];
  for(const k in S.stocks){const c=calc(S.stocks[k]);h.push([k,nameOf(k),+c.sh.toFixed(6),+c.avg.toFixed(4),+S.stocks[k].price||'',+c.cost.toFixed(2),+c.val.toFixed(2),+c.pl.toFixed(2),+c.plp.toFixed(2),+c.realized.toFixed(2)])}
  const cu=cashUsd();if(cu>0)h.push(['현금','','','','',+cu.toFixed(2),'','','']);
  const ip=[['매도일','종목','증권사','수량','공모가','매도가','수수료·세금','수익금(원)','수익률(%)']];
  (S.ipo||[]).slice().sort((a,b)=>a.d<b.d?-1:1).forEach(x=>ip.push([x.d,x.n,x.b||'',x.q||'',x.op||'',x.sp||'',x.f||'',x.pl,ipoRate(x)==null?'':+ipoRate(x).toFixed(2)]));
  return {'보유현황':h,'공모주':ip};
}
async function api(method,body,extra=''){
  const opt=method==='POST'?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}:{};
  const url=method==='GET'?SY.url+(SY.url.includes('?')?'&':'?')+'key='+encodeURIComponent(SY.key)+extra+'&t='+Date.now():SY.url;
  const r=await fetch(url,opt);const t=await r.text();
  try{return JSON.parse(t)}catch(e){throw new Error('응답이 올바르지 않습니다. 웹 앱 주소(/exec)와 배포 권한을 확인하세요.')}
}
function failed(e){setSync('error',navigator.onLine===false?'오프라인 · 연결되면 다시 시도합니다':(e&&e.message)||'연결 실패')}
function schedulePush(){clearTimeout(pushTimer);setSync('pending');pushTimer=setTimeout(()=>push(false),1500)}
async function push(force){
  if(!syncOn()||busy){if(busy)schedulePush();return}
  busy=true;setSync('pending');const rev=SY.rev;
  try{
    const r=await api('POST',{key:SY.key,data:S,base:SY.updated,force:!!force,view:buildView()});
    if(r.ok){SY.updated=r.updated;SY.last=Date.now();if(SY.rev===rev)SY.dirty=false;conflict=null;saveSY();setSync(SY.dirty?'pending':'ok');if(SY.dirty)schedulePush()}
    else if(r.conflict){conflict={data:r.data,updated:r.updated};setSync('conflict');render()}
    else if(r.error==='readonly'){SY.ro=true;SY.dirty=false;saveSY();setSync('ok');render()}
    else if(r.error==='key')setSync('error','비밀 키가 맞지 않습니다');
    else setSync('error','저장 실패');
  }catch(e){failed(e)}
  busy=false;
}
async function pull(){
  if(!syncOn()||busy||conflict)return;
  busy=true;setSync('pending');
  try{
    const r=await api('GET');busy=false;
    if(!r.ok){setSync('error',r.error==='key'?'비밀 키가 맞지 않습니다':'불러오기 실패');return}
    const ro=r.role==='view';if(ro!==!!SY.ro){SY.ro=ro;saveSY();setTimeout(render,0)}
    if(!r.data){if(SY.ro)return setSync('ok');busy=false;return push(true)}                 // 시트가 비어 있으면 이 기기 데이터로 시작
    if(SY.ro&&(r.updated!==SY.updated||SY.roDirty)){S=r.data;applyQuotes();SY.updated=r.updated;SY.roDirty=false;SY.dirty=false;SY.last=Date.now();store();saveSY();setSync('ok');render();return}
    if(r.updated===SY.updated){SY.last=Date.now();saveSY();if(SY.dirty)return push(false);return setSync('ok')}
    if(!SY.dirty||!hasData(S)||S.sample){S=r.data;applyQuotes();SY.updated=r.updated;SY.dirty=false;SY.last=Date.now();store();saveSY();setSync('ok');render();return}
    conflict={data:r.data,updated:r.updated};setSync('conflict');render();
  }catch(e){busy=false;failed(e)}
}
/* ===== 자동 시세 (구글 시트 GOOGLEFINANCE) =====
   Q는 이 기기에만 저장. 시세 반영은 '변경'으로 치지 않아 기기 간 충돌을 만들지 않음 */
let Q={prices:{},fx:null,at:0},qBusy=false,qMsg='';
try{Object.assign(Q,JSON.parse(localStorage.getItem('avgcost.q'))||{})}catch(e){}
const qTime=()=>Q.at?new Date(Q.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
function applyQuotes(){
  if(!S||!S.stocks||(!Q.at&&!Object.keys(LV).length))return false;
  for(const k in S.stocks){const g=Q.prices&&Q.prices[k],l=LV[k];
    if(l&&l.c>0&&(!(g>0)||l.at>=Q.at))S.stocks[k].price=l.c;else if(g>0)S.stocks[k].price=g}
  if(Q.fx>0&&S.autoFx!==false)S.fx=Math.round(Q.fx*100)/100;
  return true;
}
async function refreshQuotes(force){
  if(!syncOn()||qBusy)return;
  const tks=Object.keys(S.stocks);
  if(!force&&Q.at&&Date.now()-Q.at<5*60e3&&tks.every(k=>k in (Q.prices||{}))){if(applyQuotes()){store();render()}return}
  qBusy=true;qMsg='';paintQuote();
  try{
    const r=await api('GET',null,'&action=quotes&tickers='+encodeURIComponent(tks.join(',')));
    if(r.ok&&r.prices){Q={prices:r.prices,fx:r.fx,at:r.at||Date.now()};try{localStorage.setItem('avgcost.q',JSON.stringify(Q))}catch(e){}
      const miss=tks.filter(k=>!(r.prices[k]>0));qMsg=miss.length?miss.join(', ')+' 시세 없음 · 직접 입력':'';
      applyQuotes();store();}
    else if(r.ok&&!r.prices)qMsg='Apps Script 코드를 새 버전으로 배포해야 시세가 나옵니다';
    else qMsg=r.error==='key'?'비밀 키가 맞지 않습니다':'시세를 불러오지 못했습니다';
  }catch(e){qMsg=navigator.onLine===false?'오프라인':'시세를 불러오지 못했습니다'}
  qBusy=false;render();
}
/* ===== 실시간 시세 (Finnhub, 브라우저에서 직접 호출) =====
   키와 시세는 이 기기에만 저장. 장중에는 15초 이상 간격, 장 마감 후에는 10분 간격 */
let FH='';try{FH=localStorage.getItem('avgcost.fh')||''}catch(e){}
let LV={};try{LV=JSON.parse(localStorage.getItem('avgcost.lv'))||{}}catch(e){}
let lvAt=0,lvBusy=false,lvMsg='',lvTimer=null;
function mkt(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const m=(+p.hour%24)*60+(+p.minute),wk=!['Sat','Sun'].includes(p.weekday);
  return wk&&m>=570&&m<960?'open':'closed';           // 정규장 09:30~16:00 (미국 동부), 휴장일은 반영 안 함
}
/* 손익이 가리키는 미국장 날짜: 장중이면 '오늘 미국장', 아니면 가장 최근 정규장 날짜 (미국 휴장일은 반영 안 함) */
function sessLabel(){
  if(mkt()==='open')return '오늘 미국장 (장중)';
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const d=new Date(Date.UTC(+p.year,+p.month-1,+p.day));
  const wd=d.getUTCDay(),m=(+p.hour%24)*60+(+p.minute);
  if(wd===0||wd===6||m<570)d.setUTCDate(d.getUTCDate()-1);       // 주말이거나 개장 전이면 하루 전부터
  while([0,6].includes(d.getUTCDay()))d.setUTCDate(d.getUTCDate()-1);
  return `${d.getUTCMonth()+1}/${d.getUTCDate()}(${'일월화수목금토'[d.getUTCDay()]}) 미국장`;
}
const tm=t=>new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
async function liveTick(force){
  clearTimeout(lvTimer);
  if(!FH){return}
  const open=mkt()==='open',tks=Object.keys(S.stocks);
  const gap=Math.max(15,Math.ceil(tks.length*1.3))*1000;   // 무료 한도 분당 60회 이내
  if(document.visibilityState!=='visible'){return}
  if(!force&&!open&&lvAt&&Date.now()-lvAt<10*60e3){lvTimer=setTimeout(()=>liveTick(false),10*60e3);return}
  if(lvBusy||!tks.length){lvTimer=setTimeout(()=>liveTick(false),gap);return}
  lvBusy=true;lvMsg='';let bad=[],fatal='';
  for(const k of tks){
    try{
      const r=await fetch('https://finnhub.io/api/v1/quote?symbol='+encodeURIComponent(k)+'&token='+encodeURIComponent(FH));
      if(r.status===401||r.status===403){fatal='Finnhub 키가 올바르지 않습니다';break}
      if(r.status===429){fatal='요청이 많아 잠시 쉬었다가 다시 불러옵니다';break}
      const j=await r.json();
      if(j&&j.c>0)LV[k]={c:j.c,d:j.d||0,dp:j.dp||0,pc:j.pc||0,at:Date.now()};else bad.push(k);
    }catch(e){fatal=navigator.onLine===false?'오프라인':'실시간 시세에 연결하지 못했습니다';break}
  }
  lvBusy=false;
  if(!fatal){lvAt=Date.now();lvMsg=bad.length?bad.join(', ')+' 실시간 시세 없음':''}else lvMsg=fatal;
  try{localStorage.setItem('avgcost.lv',JSON.stringify(LV))}catch(e){}
  applyQuotes();store();softRender();
  lvTimer=setTimeout(()=>liveTick(false),fatal?60e3:open?gap:10*60e3);
}
/* 입력 중에는 화면을 다시 그리지 않음 */
function softRender(){
  const a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if(tab==='hold'&&!typing&&!addOpen&&!cashOpen){const y=scrollY;render();scrollTo(0,y);return}
  if(tab==='stock'&&S.stocks[S.sel]){const st=S.stocks[S.sel],el=$('#sum');if(el)el.innerHTML=summary(st,calc(st));
    const pi=$('#price');if(pi&&a!==pi)pi.value=st.price||'';const pl=$('#plab');if(pl)pl.innerHTML=priceTag(S.sel)}
  const h=$('#hdr');if(h)h.innerHTML=statusChip();
}
function priceTag(k){
  const l=LV[k];
  if(FH&&l&&l.c>0&&(!Q.at||l.at>=Q.at))return ` · <span style="color:var(--accent)">실시간 ${tm(l.at)}</span> ${chg(l.d,l.dp)}`;
  return Q.prices&&Q.prices[k]>0?` · <span style="color:var(--accent)">자동 ${qTime()}</span>`:'';
}
function dayPL(){
  let d=0,b=0,n=0;
  for(const k in S.stocks){const l=LV[k];if(!l||!(l.c>0))continue;const sh=calc(S.stocks[k]).sh;if(!sh)continue;d+=sh*l.d;b+=sh*l.pc;n++}
  return n?{d,p:b?d/b*100:0}:null;
}

/* ===== 보유 종목 뉴스 (Finnhub company-news, 최근 7일) =====
   종목별 15분 캐시, 이 기기에만 저장. 불러오면 뉴스 영역만 다시 그림 */
const SHOW_NEWS=false;   // 뉴스 표시 여부 (true로 바꾸면 보유·종목 탭에 뉴스 카드가 다시 나옴)
let NW={};try{NW=JSON.parse(localStorage.getItem('avgcost.nw'))||{}}catch(e){}
let newsBusy=false,newsErr='',trNote='';
let NL='ko';try{NL=localStorage.getItem('avgcost.nl')||'ko'}catch(e){}
/* 아직 번역 안 된 헤드라인·요약을 모아 Apps Script(구글 번역)로 한 번에 번역 */
async function translateNews(tks){
  if(NL!=='ko')return;
  if(!syncOn()){trNote='구글 시트를 연결하면 한국어로 번역됩니다';return}
  const jobs=[];
  tks.forEach(k=>(NW[k]?.items||[]).forEach(x=>{if(!x.tr){jobs.push([x,'hk',x.h]);if(x.s&&x.s!==x.h)jobs.push([x,'sk',x.s.slice(0,300)])}}));
  if(!jobs.length)return;
  for(let i=0;i<jobs.length;i+=80){
    const part=jobs.slice(i,i+80);
    const r=await api('POST',{key:SY.key,action:'tr',texts:part.map(j=>j[2])});
    if(!r.ok||!Array.isArray(r.texts)){trNote=r.error==='key'?'비밀 키가 맞지 않아 번역하지 못했습니다':'Apps Script를 새 버전으로 배포하면 한국어로 번역됩니다';return}
    part.forEach((j,n)=>{const v=r.texts[n];if(v)j[0][j[1]]=v});
    part.forEach(j=>{j[0].tr=true});
  }
  trNote='';
  try{localStorage.setItem('avgcost.nw',JSON.stringify(NW))}catch(e){}
}
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function ago(t){const m=Math.round((Date.now()-t)/6e4);if(m<1)return '방금';if(m<60)return m+'분 전';const h=Math.round(m/60);if(h<24)return h+'시간 전';const d=Math.round(h/24);return d+'일 전'}
async function loadNews(tk,force){
  const c=NW[tk];if(!FH||(!force&&c&&Date.now()-c.at<15*60e3))return;
  const to=new Date(),from=new Date(Date.now()-7*864e5);
  const r=await fetch(`https://finnhub.io/api/v1/company-news?symbol=${encodeURIComponent(tk)}&from=${ymd(from)}&to=${ymd(to)}&token=${encodeURIComponent(FH)}`);
  if(r.status===401||r.status===403)throw new Error('key');
  if(r.status===429)throw new Error('limit');
  const j=await r.json(),seen=new Set();
  const items=(Array.isArray(j)?j:[]).filter(x=>x&&x.headline&&/^https?:\/\//.test(x.url||'')).sort((a,b)=>b.datetime-a.datetime)
    .filter(x=>{const k=x.headline.trim().toLowerCase();if(seen.has(k))return false;seen.add(k);return true})
    .slice(0,12).map(x=>({h:x.headline.trim(),s:(x.summary||'').trim(),src:x.source||'',u:x.url,t:x.datetime*1000}));
  NW[tk]={at:Date.now(),items};
  try{localStorage.setItem('avgcost.nw',JSON.stringify(NW))}catch(e){}
}
function newsItems(items,tkOf){
  if(!items.length)return '<p class="note">최근 7일간 뉴스가 없습니다.</p>';
  return `<div class="news">${items.map(x=>`<a class="nitem" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer">
    <span class="nmeta">${tkOf?`<span class="ntk" style="--tc:${tkOf(x)[1]}">${esc(tkOf(x)[0])}</span>`:''}<span>${esc(x.src)}</span><span>·</span><span>${ago(x.t)}</span></span>
    <span class="nh">${esc(NL==='ko'&&x.hk||x.h)}</span>${x.s&&x.s!==x.h?`<span class="ns">${esc(NL==='ko'&&x.sk||x.s)}</span>`:''}</a>`).join('')}</div>${NL==='ko'&&trNote?`<p class="note qwarn">${esc(trNote)}</p>`:''}`;
}
function newsBody(tk){
  if(!FH)return '<p class="note">설정 탭에서 Finnhub 키를 연결하면 이 종목의 최근 뉴스가 나옵니다.</p>';
  const c=NW[tk];
  if(!c)return `<p class="note">${newsErr?esc(newsErr):'뉴스 불러오는 중…'}</p>`;
  return newsItems(c.items.slice(0,8))+(newsErr?`<p class="note qwarn">${esc(newsErr)}</p>`:'');
}
function newsAllBody(){
  if(!FH)return '<p class="note">설정 탭에서 Finnhub 키를 연결하면 보유 종목 뉴스가 모아서 나옵니다.</p>';

/* ===== 링크 하나로 연결 =====
   링크: 앱주소#c=<base64url(JSON{u:웹앱주소,k:키,f:Finnhub키,r:보기전용})>
   해시(#)는 서버로 전송되지 않음. 보기 전용 키 = SHA-256(비밀키+':view') 앞 24자 (Apps Script도 같은 방식으로 확인) */
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/')))));
async function viewKeyOf(secret){
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(secret+':view'));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,24);
}
function parseConnect(text){
  const m=String(text||'').match(/[#&]?c=([A-Za-z0-9_-]{20,})/)||String(text||'').trim().match(/^([A-Za-z0-9_-]{20,})$/);
  if(!m)return null;
  try{const o=b64d(m[1]);return o&&o.u&&o.k?o:null}catch(e){return null}
}
let PEND=null;
try{if(location.hash.includes('c=')){PEND=parseConnect(location.hash);history.replaceState(null,'',location.pathname+location.search)}}catch(e){}

}

}

const krw=n=>(n<0?'-':'')+'₩'+Math.round(Math.abs(n)).toLocaleString('ko-KR');
const qf=n=>(+n.toFixed(6)).toLocaleString('en-US',{maximumFractionDigits:6});

/* 이동평균법: 매수 시 (기존원가+매수금액+수수료)/보유수량, 매도 시 평단 유지·실현손익 계산 */
function calc(st){
  let sh=0,cost=0,realized=0;
  const rows=st.tx.map((x,i)=>({...x,i})).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.i-b.i).map(x=>{
    const f=+x.f||0;
    if(x.t==='buy'){sh+=x.q;cost+=x.q*x.p+f;x.rp=null}
    else{const avg=sh?cost/sh:0,q=Math.min(x.q,sh);x.rp=q*x.p-f-avg*q;realized+=x.rp;cost-=avg*q;sh-=q;if(sh<1e-9){sh=0;cost=0}}
    x.sh=sh;x.avg=sh?cost/sh:0;return x;});
  const avg=sh?cost/sh:0,val=sh*(+st.price||0),pl=val-cost;
  return{sh,cost,avg,val,pl,plp:cost?pl/cost*100:0,realized,rows};
}
function totals(){let c=0,v=0,r=0;for(const k in S.stocks){const x=calc(S.stocks[k]);c+=x.cost;v+=x.val;r+=x.realized}return{c,v,r,pl:v-c,plp:c?(v-c)/c*100:0}}

/* 비중 도넛: 평가금액(val) 또는 매입금액(cost) 기준, 8개 초과분은 '기타'로 묶음 */
/* 종목별 고정 색: 평가금액(없으면 매입금액) 큰 순서로 c1~c7, 나머지는 회색 */
function colorMap(){
  const ks=Object.keys(S.stocks).map(k=>{const c=calc(S.stocks[k]);return{k,v:c.val||c.cost}}).sort((a,b)=>b.v-a.v);
  const many=ks.length>12,m={};ks.forEach((x,i)=>m[x.k]=many&&i>=11?'var(--cx)':`var(--c${i+1})`);return m;
}
function allocChart(){
  const CM=colorMap();
  const f=fx();
  let items=Object.keys(S.stocks).map(k=>{const c=calc(S.stocks[k]);return{k,v:basis==='val'?c.val:c.cost,plp:c.plp,has:c.cost>0}}).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  if(items.length>8){const rest=items.slice(7);items=items.slice(0,7);items.push({k:'기타 '+rest.length+'종목',v:rest.reduce((a,x)=>a+x.v,0),other:true})}
  const cu=cashUsd();if(cu>0)items.push({k:'현금',v:cu,cash:true});
  const sum=items.reduce((a,x)=>a+x.v,0);
  const head=`<div class="split" style="margin-bottom:12px"><h2 style="margin:0">자산 구성</h2>
    <div class="seg sm"><button type="button" data-basis="val" aria-pressed="${basis==='val'}">지금 가치</button><button type="button" data-basis="cost" aria-pressed="${basis==='cost'}">투자한 돈</button></div></div>`;
  if(!sum)return `<div class="card">${head}<p class="note">${basis==='val'?'종목 탭에서 현재가를 입력하면 평가금액 기준 비중이 나옵니다.':'매수 기록을 넣으면 비중이 나옵니다.'}</p></div>`;
  items.forEach(x=>{x.p=x.v/sum*100;x.c=x.cash?'var(--cash)':x.other?'var(--c9)':CM[x.k]});
  const R=60,C=2*Math.PI*R,gap=items.length>1?1.5:0;let off=0;
  const arcs=items.map(x=>{const len=Math.max(C*x.p/100-gap,0.5);const s=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="${x.c}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(x.k)} ${x.p.toFixed(1)}%</title></circle>`;off+=C*x.p/100;return s}).join('');
  const top=items[0];
  const legend=items.map(x=>`<div class="lg"><span class="dot" style="background:${x.c}"></span><span class="t">${esc(x.k)}</span><span class="p">${x.p.toFixed(1)}%</span>
    <span class="bar"><i style="width:${x.p}%;background:${x.c}"></i></span>
    <span class="s">${usd(x.v,0)}${f?' · '+krw(x.v*f):''}</span></div>`).join('');
  return `<div class="card">${head}
    <div class="alloc">
      <svg viewBox="0 0 150 150" role="img" aria-label="종목 비중 도넛 차트"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--bg)" stroke-width="20"/>${arcs}
        <text x="75" y="70" text-anchor="middle" class="ctr1">${cu>0?'현금 포함':basis==='val'?'평가금액':'매입금액'}</text>
        <text x="75" y="90" text-anchor="middle" class="ctr2">${usd(sum,0)}</text></svg>
      <div class="legend">${legend}</div>
    </div>
    ${items.length>1&&top.p>=50&&!top.other&&!top.cash?`<p class="warn">${esc(top.k)} 비중이 ${top.p.toFixed(0)}%로 한 종목에 절반 이상 몰려 있습니다.</p>`:''}
  </div>`;
}

function allocBar(rows,cu,total,CM){
  if(!total)return '';
  let items=rows.filter(r=>r.c.val>0).map(r=>({k:r.k,v:r.c.val,c:CM[r.k]})).sort((a,b)=>b.v-a.v);
  if(items.length>12){const rest=items.slice(11);items=items.slice(0,11);items.push({k:'기타',v:rest.reduce((a,x)=>a+x.v,0),c:'var(--cx)'})}
  if(cu>0)items.push({k:'현금',v:cu,c:'var(--cash)'});
  items.forEach(x=>x.p=x.v/total*100);
  const top=items.find(x=>x.k!=='현금'&&x.k!=='기타');
  return `<div class="card">
    <div class="split" style="margin-bottom:12px"><h2 style="margin:0">비중</h2><span class="muted" style="font-size:13px">지금 가치 기준</span></div>
    <div class="sbar" role="img" aria-label="종목 비중">${items.map(x=>`<i style="width:${x.p}%;background:${x.c}" title="${esc(x.k)} ${x.p.toFixed(1)}%"></i>`).join('')}</div>
    <div class="legend2">${items.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.k)} <b>${x.p.toFixed(1)}%</b></span>`).join('')}</div>
    ${top&&top.p>=50&&items.length>1?`<p class="warn">${esc(top.k)}에 자산의 ${top.p.toFixed(0)}%가 몰려 있습니다.</p>`:''}
  </div>`;
}

}

/* 공모주: 원화 수익 기록. 공모가·매도가·수량을 넣으면 수익금 자동 계산 */
let ipoYear='all';
const won=n=>(n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('ko-KR')+'원';
/* 공모주 수익률: 수익금 ÷ 투자금(공모가×수량). 공모가·수량이 없으면 계산하지 않음 */
const ipoCost=x=>(+x.op||0)*(+x.q||0);
const ipoRate=x=>ipoCost(x)>0?x.pl/ipoCost(x)*100:null;
const rateTxt=r=>r==null?'':`${r>0?'+':''}${r.toFixed(1)}%`;
/* 공모가 목록 (Apps Script가 38커뮤니케이션에서 받아온 [종목명, 확정공모가, 청약일]) — 이 기기에 12시간 저장 */
let IPL={at:0,list:[]},iplBusy=false;try{Object.assign(IPL,JSON.parse(localStorage.getItem('avgcost.ipl'))||{})}catch(e){}
const inorm=n=>String(n||'').replace(/\(.*?\)|㈜|주식회사|\s/g,'').toLowerCase();
function ipoFind(name){
  const k=inorm(name);if(!k)return null;
  const ex=IPL.list.filter(x=>inorm(x.n)===k);if(ex.length)return ex[0];
  const pt=IPL.list.filter(x=>{const n=inorm(x.n);return n.startsWith(k)||k.startsWith(n)});
  return pt.length===1?pt[0]:null;
}
/* 공모가가 빈 기존 기록을 목록으로 채움 */
function fillIpoPrices(){
  let n=0;(S.ipo||[]).forEach(x=>{if(!(+x.op)){const h=ipoFind(x.n);if(h){x.op=h.p;n++}}});
  if(n){save();toast('공모가 '+n+'건을 자동으로 채웠습니다')}
  return n;
}
async function loadIpoList(force){
  if(!syncOn()||iplBusy)return;
  if(!force&&IPL.list.length&&Date.now()-IPL.at<12*3600e3){if(fillIpoPrices()&&tab==='ipo')render();return}
  iplBusy=true;
  try{const r=await api('GET',null,'&action=ipolist'+(force?'&force=1':''));
    if(r.ok&&Array.isArray(r.list)&&r.list.length){IPL={at:Date.now(),list:r.list};try{localStorage.setItem('avgcost.ipl',JSON.stringify(IPL))}catch(e){}}}
  catch(e){}
  iplBusy=false;
  fillIpoPrices();
  if(tab==='ipo'){const dl=$('#ipoNames');if(dl)dl.innerHTML=ipoOptions();const a=document.activeElement;if(!(a&&/INPUT/.test(a.tagName)))render()}
}
const ipoOptions=()=>IPL.list.slice(0,200).map(x=>`<option value="${esc(x.n.replace(/\(.*?\)/g,'').trim())}">${x.p.toLocaleString()}원 · ${esc(x.d)}</option>`).join('');
function vIpo(){
  setTimeout(()=>loadIpoList(false),300);
  const all=S.ipo.map((x,i)=>({...x,i})).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.i-a.i);
  const years=[...new Set(all.map(x=>x.d.slice(0,4)))].sort().reverse();
  if(ipoYear!=='all'&&!years.includes(ipoYear))ipoYear='all';
  const rows=ipoYear==='all'?all:all.filter(x=>x.d.startsWith(ipoYear));
  const sum=rows.reduce((a,x)=>a+x.pl,0),win=rows.filter(x=>x.pl>0).length;
  const best=rows.reduce((m,x)=>!m||x.pl>m.pl?x:m,null);
  const rated=rows.filter(x=>ipoCost(x)>0),inv=rated.reduce((a,x)=>a+ipoCost(x),0),wRate=inv?rated.reduce((a,x)=>a+x.pl,0)/inv*100:null;
  const bestR=rated.reduce((m,x)=>!m||ipoRate(x)>ipoRate(m)?x:m,null);
  const cy=today().slice(0,4),thisYear=all.filter(x=>x.d.startsWith(cy)).reduce((a,x)=>a+x.pl,0);
  let monthly='';
  if(ipoYear!=='all'){const m=Array(12).fill(0);rows.forEach(x=>m[+x.d.slice(5,7)-1]+=x.pl);const mx=Math.max(1,...m.map(Math.abs));
    monthly=`<div class="label" style="margin-top:14px">${ipoYear}년 월별</div><div class="months">${m.map((v,i)=>`<div class="m" title="${i+1}월 ${won(v)}"><i class="${v<0?'neg':''}" style="height:${Math.round(Math.abs(v)/mx*62)}px"></i><span>${i+1}</span></div>`).join('')}</div>`}
  const list=rows.map(x=>`<div class="ipo">
      <span class="n">${esc(x.n)}</span><span class="v ${cls(x.pl)}">${x.pl>0?'+':''}${won(x.pl)}${ipoRate(x)!=null?`<span class="ipr ${cls(x.pl)}">${rateTxt(ipoRate(x))}</span>`:''}</span>
      <span class="meta num">${x.d}${x.b?' · '+esc(x.b):''}${x.q?` · ${x.q.toLocaleString()}주`:''}${x.op&&x.sp?` · ${x.op.toLocaleString()}→${x.sp.toLocaleString()}원`:''}</span>
      <span class="act"><button class="x" data-ipodel="${x.i}">삭제</button></span></div>`).join('');
  return `<div class="ychips"><button class="chip" data-year="all" aria-pressed="${ipoYear==='all'}">전체</button>${years.map(y=>`<button class="chip" data-year="${y}" aria-pressed="${ipoYear===y}">${y}</button>`).join('')}</div>
  <div class="card">
    <div class="label">${ipoYear==='all'?'누적 공모주 수익':ipoYear+'년 공모주 수익'}</div>
    <div class="big num ${cls(sum)}">${sum>0?'+':''}${won(sum)}</div>
    <div class="muted num" style="font-size:13px">건당 평균 ${rows.length?won(sum/rows.length):'—'}${inv?` · 투자금 ${won(inv)} 기준`:''}</div>
    <div class="row2" style="margin-top:14px">
      <div class="kv"><div class="label">참여 / 수익 건수</div><div class="v num">${rows.length}건 / ${win}건</div></div>
      <div class="kv"><div class="label">평균 수익률</div><div class="v num ${wRate==null?'':cls(wRate)}">${wRate==null?'—':rateTxt(wRate)}</div></div>
      <div class="kv"><div class="label">최고 수익</div><div class="v" style="font-size:14px">${best?esc(best.n)+' <span class="num '+cls(best.pl)+'">'+won(best.pl)+'</span>':'—'}</div></div>
      <div class="kv"><div class="label">최고 수익률</div><div class="v" style="font-size:14px">${bestR?esc(bestR.n)+' <span class="num '+cls(bestR.pl)+'">'+rateTxt(ipoRate(bestR))+'</span>':'—'}</div></div>
    </div>
    ${ipoYear==='all'?`<div class="muted num" style="font-size:13px;margin-top:10px">올해(${cy}) <span class="${cls(thisYear)}">${thisYear>0?'+':''}${won(thisYear)}</span></div>`:''}
    ${monthly}
  </div>
  <form class="card stack" id="ipoForm">
    <h2 style="margin:0">수익 기록</h2>
    <div class="row2">
      <label class="f">종목명<input id="iN" required placeholder="예: OO바이오" autocomplete="off" list="ipoNames"><datalist id="ipoNames">${ipoOptions()}</datalist></label>
      <label class="f">매도일<input id="iD" type="date" value="${today()}" required></label>
      <label class="f">공모가 (원)<input id="iOp" class="num ic" type="number" inputmode="numeric" min="0" placeholder="선택"></label>
      <label class="f">매도가 (원)<input id="iSp" class="num ic" type="number" inputmode="numeric" min="0" placeholder="선택"></label>
      <label class="f">수량 (주)<input id="iQ" class="num ic" type="number" inputmode="numeric" min="0" placeholder="선택"></label>
      <label class="f">수수료·세금 (원)<input id="iF" class="num ic" type="number" inputmode="numeric" min="0" placeholder="선택"></label>
    </div>
    <label class="f">수익금 (원) <span id="iRate" class="ipr" style="margin:0"></span><input id="iPl" class="num" type="number" inputmode="numeric" step="1" required placeholder="공모가·매도가·수량을 넣으면 자동 계산"></label>
    <label class="f">증권사 (선택)<input id="iB" placeholder="예: NH, 한투" autocomplete="off"></label>
    <button class="btn">기록하기</button>
    <p class="note" id="iHint">${syncOn()?(IPL.list.length?'종목명을 입력하면 확정공모가가 자동으로 채워집니다.':'공모가 목록을 불러오는 중입니다…'):'구글 시트를 연결하면 공모가가 자동으로 채워집니다.'} 수익금만 적어도 되고, 손실이면 앞에 -를 붙이세요.</p>
  </form>
  <div class="card">
    <h2>${ipoYear==='all'?'전체 기록':ipoYear+'년 기록'}</h2>
    ${list||'<p class="empty">아직 기록이 없습니다.</p>'}
  </div>`;
}

    <p class="note">링크를 받은 기기에서 누르면 바로 연결되고, 그 기기에서도 보고 고칠 수 있어요. 링크에 비밀 키가 들어 있으니 <b>가족에게만</b> 보내세요.</p>

    <textarea id="lkOut" readonly hidden></textarea>`:'<p class="note">이 기기가 아직 연결되지 않았습니다. 받은 연결 링크(또는 코드)를 아래에 붙여넣으세요.</p>'}
    <details class="guide" ${syncOn()?'':'open'}><summary>받은 연결 링크 붙여넣기 (아이폰은 이 방법으로)</summary>

    </details>
  </div>
  <div class="card stack">
    <h2 style="margin:0">실시간 시세 (Finnhub)</h2>

    <label class="f">API 키<input id="fhKey" type="password" value="${esc(FH)}" placeholder="finnhub.io 대시보드의 API key" autocomplete="off"></label>
    ${FH?`<div class="row2"><button class="btn" id="fhSave" type="button">저장</button><button class="ghost" id="fhOff" type="button">해제</button></div>`:`<button class="btn" id="fhSave" type="button">연결하기</button>`}
    <p class="note">키는 이 기기에만 저장됩니다. PC와 폰에 각각 한 번씩 넣으세요. 장중(한국시간 서머타임 22:30~05:00)에는 15초마다 갱신됩니다.</p>
  </div>
  <div class="card stack">

    <div class="sstat" id="syncStat">${syncText()}</div>
    <label class="f">웹 앱 주소<input id="syUrl" value="${esc(SY.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" inputmode="url"></label>
    <label class="f">비밀 키<input id="syKey" type="password" value="${esc(SY.key)}" placeholder="Apps Script의 SECRET 값" autocomplete="off"></label>
    ${syncOn()?`<div class="row2"><button class="btn" id="syNow" type="button">지금 동기화</button><button class="ghost" id="syOff" type="button">연결 해제</button></div>`:`<button class="btn" id="syOn" type="button">연결하기</button>`}
    <details class="guide"><summary>설정 방법</summary><ol>
      <li>구글 시트를 새로 만들고 확장 프로그램 → Apps Script를 엽니다.</li>
      <li>받은 Code.gs 내용을 붙여넣고 SECRET 값을 나만 아는 문자열로 바꿉니다.</li>
      <li>배포 → 새 배포 → 웹 앱, 실행: 나, 액세스: 모든 사용자로 배포합니다.</li>
      <li>나온 웹 앱 주소와 SECRET 값을 여기에 넣고 연결합니다. PC와 폰 모두 같은 값을 넣으세요.</li>

  <div class="card stack">
    <h2 style="margin:0">환율</h2>
    <label class="f">원/달러 (₩)<input id="fx" class="num" type="number" inputmode="decimal" step="0.1" value="${S.fx||''}" placeholder="1385"></label>
    <label style="display:flex;align-items:center;gap:8px;font-size:14px"><input id="autoFx" type="checkbox" ${S.autoFx!==false?'checked':''} style="width:auto"> 구글 시세로 환율 자동 반영</label>
    <p class="note">입력하면 모든 화면에 원화 환산 금액이 함께 표시됩니다. 자동 반영을 켜면 시세를 불러올 때마다 환율이 바뀝니다.</p>
  </div>
  <div class="card stack">
    <h2 style="margin:0">백업 · 복원</h2>
    <p class="note">${syncOn()?'구글 시트와 동기화 중입니다. 시트가 자동 백업 역할을 하지만, 가끔 복사해 두면 더 안전합니다.':'기록은 이 기기의 브라우저에만 저장됩니다. 가끔 복사해서 메모나 카톡에 보관하세요.'}</p>
    <button class="btn" id="cpy">데이터 복사</button>
    <button class="ghost" id="restoreBtn">붙여넣어 복원</button>
    <div id="restoreBox" class="stack" hidden><textarea id="restoreTxt" placeholder="복사해 둔 데이터를 붙여넣으세요"></textarea><button class="btn" id="restoreGo">복원하기</button></div>
  </div>
  <p class="note" style="padding:0 4px">평단은 이동평균법으로 계산합니다. 매수 수수료는 평단에 포함되고, 매도해도 남은 주식의 평단은 바뀌지 않습니다.</p>`;
}

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,1800)}
function go(t){tab=t;try{localStorage.setItem(TABKEY,t)}catch(e){}render();scrollTo(0,0)}
function arm(btn,label,fn){if(btn.dataset.armed){fn()}else{btn.dataset.armed=1;btn.classList.add('armed');const o=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.classList.remove('armed');btn.textContent=o}},3000)}}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab)return go(b.dataset.tab);
  if(b.dataset.go)return go(b.dataset.go);
  if(b.dataset.open){S.sel=b.dataset.open;save();return go('stock')}
  if(b.dataset.sel){S.sel=b.dataset.sel;save();return render()}
  if(b.dataset.basis){basis=b.dataset.basis;try{localStorage.setItem('avgcost.basis',basis)}catch(e){}const y=scrollY;render();scrollTo(0,y);return}
  if(b.dataset.tt){txType=b.dataset.tt;const q=$('#txQ').value,p=$('#txP').value,d=$('#txD').value,f=$('#txF').value;render();$('#txQ').value=q;$('#txP').value=p;$('#txD').value=d;$('#txF').value=f;return}
  if(b.dataset.year){ipoYear=b.dataset.year;return render()}
  if(b.dataset.ipodel!=null)return arm(b,'확인',()=>{S.ipo.splice(+b.dataset.ipodel,1);save();render();toast('삭제했습니다')});
  if(b.dataset.del!=null)return arm(b,'확인',()=>{S.stocks[S.sel].tx.splice(+b.dataset.del,1);save();render();toast('삭제했습니다')});
  if(b.dataset.sync==='remote'){S=conflict.data;applyQuotes();SY.updated=conflict.updated;SY.dirty=false;SY.last=Date.now();conflict=null;store();saveSY();setSync('ok');render();return toast('시트 데이터로 맞췄습니다')}
  if(b.dataset.sync==='local'){conflict=null;render();push(true);return toast('이 기기 데이터로 덮어씁니다')}
  if(b.id==='syncDot')return go('set');
  if(b.id==='clearSample'){if(!S.sample)return;S={fx:S.fx,sel:null,stocks:{},ipo:[],cash:{usd:0,krw:0},sample:false};store();render();toast('예시 데이터를 지웠습니다');return}
  if(b.id==='cnYes'&&PEND)return applyConnect(PEND);
  if(b.id==='cnNo'){PEND=null;return render()}
  if(b.id==='lkGo'){const o=parseConnect($('#lkIn').value);if(!o)return toast('연결 링크가 올바르지 않습니다. 링크 전체를 붙여넣으세요');PEND=o;go('hold');return}
  if(b.id==='lkEdit'||b.id==='lkView'){makeLink(b.id==='lkView').then(link=>{
      const done=()=>toast('연결 링크를 복사했습니다. 카톡으로 보내세요');
      (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(done).catch(()=>{const t=$('#lkOut');t.hidden=false;t.value=link;t.select();toast('선택된 링크를 직접 복사하세요')})});return}
  if(b.dataset.hm){HV.m=b.dataset.hm;saveHV();const y=scrollY;render();scrollTo(0,y);return}
  if(b.dataset.cur){HV.cur=b.dataset.cur;saveHV();const y=scrollY;render();scrollTo(0,y);return}
  if(b.id==='newsLang'){NL=NL==='ko'?'en':'ko';try{localStorage.setItem('avgcost.nl',NL)}catch(e){}
    document.querySelectorAll('#newsLang').forEach(x=>x.textContent=NL==='ko'?'원문':'한국어');paintNews();if(NL==='ko')queueNews(false);return}
  if(b.id==='newsRefresh'){newsErr='';const a=$('#newsAll'),x=$('#newsBox');if(a)a.innerHTML='<p class="note">뉴스 불러오는 중…</p>';if(x)x.innerHTML='<p class="note">뉴스 불러오는 중…</p>';return queueNews(true)}
  if(b.id==='fhSave'){const k=$('#fhKey').value.trim();if(!k)return toast('API 키를 넣으세요');FH=k;try{localStorage.setItem('avgcost.fh',k)}catch(e){}lvMsg='';render();toast('실시간 시세를 연결합니다');liveTick(true).then(()=>{if(tab==='set')render()});return}
  if(b.id==='fhOff'){FH='';LV={};lvAt=0;clearTimeout(lvTimer);try{localStorage.removeItem('avgcost.fh');localStorage.removeItem('avgcost.lv')}catch(e){}render();toast('실시간 시세를 해제했습니다');return}
  if(b.id==='qRefresh'){if(FH)liveTick(true);return refreshQuotes(true)}
  if(b.id==='addToggle'){addOpen=!addOpen;render();if(addOpen)$('#newTk')?.focus();return}
  if(b.id==='cashToggle'){cashOpen=!cashOpen;render();if(cashOpen)$('#cashUsd')?.focus();return}
  switch(b.id){
    case 'syOn':case 'syNow':{const u=$('#syUrl').value.trim(),k=$('#syKey').value.trim();
      if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u))return toast('script.google.com 웹 앱 주소를 넣으세요');
      if(!k)return toast('비밀 키를 넣으세요');
      const changed=u!==SY.url||k!==SY.key;
      if(changed){SY.url=u;SY.key=k;SY.updated=0;SY.dirty=!!hasData(S)&&!S.sample}
      saveSY();render();if(SY.dirty&&!changed)push(false);else pull();break}
    case 'syOff':SY={url:'',key:'',updated:0,dirty:false,last:0,rev:0};saveSY();conflict=null;setSync('off');render();toast('연결을 해제했습니다. 데이터는 이 기기에 남아 있습니다');break;
    case 'toggleForm':formOpen=!formOpen;render();if(formOpen)$('#txQ').focus();break;
    case 'delTk':arm(b,'한 번 더 누르면 삭제됩니다',()=>{delete S.stocks[S.sel];S.sel=null;save();go('hold');toast('종목을 삭제했습니다')});break;
    case 'cpy':{const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('복사했습니다')).catch(()=>{$('#restoreBox').hidden=false;$('#restoreTxt').value=t;$('#restoreTxt').select();toast('선택된 텍스트를 직접 복사하세요')});break}
    case 'restoreBtn':$('#restoreBox').hidden=!$('#restoreBox').hidden;break;
    case 'restoreGo':try{const n=JSON.parse($('#restoreTxt').value);if(!n||!n.stocks)throw 0;S=n;S.sample=false;save();go('hold');toast('복원했습니다')}catch(_){toast('형식이 맞지 않습니다')}break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='addTk'){const t=$('#newTk').value.trim().toUpperCase().replace(/[^A-Z0-9.\-]/g,'');if(!t)return;
    if(!S.stocks[t])S.stocks[t]={price:0,tx:[]};S.sel=t;addOpen=false;setTimeout(()=>{refreshQuotes(true);liveTick(true)},300);S.sample=false;formOpen=true;save();go('stock');toast(t+' 추가됨')}
  if(e.target.id==='ipoForm'){const n=$('#iN').value.trim(),pl=Math.round(+$('#iPl').value);
    if(!n||!isFinite(pl)||$('#iPl').value==='')return toast('종목명과 수익금을 입력하세요');
    const num=id=>+$(id).value||0;
    S.ipo.push({n,d:$('#iD').value||today(),b:$('#iB').value.trim(),op:num('#iOp'),sp:num('#iSp'),q:num('#iQ'),f:num('#iF'),pl});
    S.sample=false;save();render();toast(n+' 기록했습니다');return}
  if(e.target.id==='txForm'){const st=S.stocks[S.sel],q=+$('#txQ').value,p=+$('#txP').value;
    if(!(q>0&&p>0))return;
    if(txType==='sell'&&q>calc(st).sh+1e-9)return toast('보유 수량보다 많이 팔 수 없습니다');
    st.tx.push({d:$('#txD').value||today(),t:txType,q,p,f:+$('#txF').value||0});S.sample=false;formOpen=false;save();render();toast('기록했습니다')}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='price'){const st=S.stocks[S.sel];st.price=+e.target.value||0;save();$('#sum').innerHTML=summary(st,calc(st));const t=totals();$('#hdr').innerHTML=t.c?`<span class="${cls(t.pl)}">${pct(t.plp)}</span>`:''}
  if(id==='fx'){S.fx=+e.target.value||0;save()}
  if(id==='cashUsd'){S.cash.usd=Math.max(0,+e.target.value||0);save()}
  if(id==='cashKrw'){S.cash.krw=Math.max(0,+e.target.value||0);save()}
  if(['sQ','sP','tA','tP'].includes(id))sim();
  if(e.target.classList.contains('ic')){const op=+$('#iOp').value,sp=+$('#iSp').value,q=+$('#iQ').value,f=+$('#iF').value||0;
    if(op>0&&sp>0&&q>0)$('#iPl').value=Math.round((sp-op)*q-f)}
  if(id==='iN'){const h=ipoFind(e.target.value),op=$('#iOp'),hint=$('#iHint');
    if(h&&op&&(!op.value||op.dataset.auto)){op.value=h.p;op.dataset.auto='1';op.dispatchEvent(new Event('input',{bubbles:true}))}
    if(hint&&h)hint.textContent=`확정공모가 ${h.p.toLocaleString()}원 (청약 ${h.d}) 자동 입력. 수량과 매도가를 넣으면 수익금과 수익률이 계산됩니다.`}
  if(id==='iOp'&&e.isTrusted)delete e.target.dataset.auto;
  if(e.target.classList.contains('ic')||id==='iPl'){const op=+$('#iOp').value,q=+$('#iQ').value,pl=$('#iPl').value,el=$('#iRate');
    if(el){const r=op>0&&q>0&&pl!==''?(+pl)/(op*q)*100:null;el.textContent=r==null?'':'수익률 '+rateTxt(r);el.className='ipr '+(r==null?'':cls(r))}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='stName'&&S.stocks[S.sel]){S.stocks[S.sel].name=e.target.value.trim();save();toast('종목명을 저장했습니다');return}
  if(e.target.id==='autoFx'){S.autoFx=e.target.checked;if(S.autoFx)applyQuotes();save();render();return}
  if(e.target.id==='cashUsd'||e.target.id==='cashKrw'){
    /* 다음 칸으로 포커스가 옮겨진 뒤 다시 그리고, 포커스를 되돌려 입력이 끊기지 않게 함 */
    setTimeout(()=>{const a=document.activeElement?.id,y=scrollY;render();scrollTo(0,y);if(a&&$('#'+a))$('#'+a).focus({preventScroll:true});toast('현금을 반영했습니다')},0)}
});
